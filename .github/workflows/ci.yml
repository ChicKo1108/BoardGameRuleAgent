name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/document-parser/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run worker:check
      - run: npm run build
      - run: npm run test:http
